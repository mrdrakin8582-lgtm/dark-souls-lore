    </p>

  <section class="lore-content fade-in fade-delay-2">
    <p>
      To prolong the Age of Fire,
      one must offer their soul to the Flame.
    </p>

    <p>
      Countless champions rose and fell,
      feeding the dying fire.
    </p>

    <p>
      The cycle repeated.
    </p>

    <p>
      Was this sacrifice salvation,
      or merely fear of the Dark?
    </p>
